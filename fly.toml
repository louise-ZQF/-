# Fly.io 配置 —— 适合需要「持久化存储 + 离中国近」的场景。
# 用法见 DEPLOY.md（flyctl launch / deploy）。
app = "fund-analyzer"
primary_region = "nrt"        # 东京，离中国较近（也可 hkg 香港）

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  HOLDINGS_PATH = "/data/holdings.yaml"   # 配合下方持久盘，保存的持仓不会丢

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

# 持久盘（需先：flyctl volumes create fund_data --size 1）
[[mounts]]
  source = "fund_data"
  destination = "/data"

# 公网访问请设置密码： flyctl secrets set APP_PASSWORD=你的密码
