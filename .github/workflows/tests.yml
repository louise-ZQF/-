name: 测试

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: 运行单元测试
        run: python -m unittest discover -s tests -v
      - name: 离线 demo 冒烟测试
        run: python -m fund_analyzer demo > /dev/null && echo "demo OK"
